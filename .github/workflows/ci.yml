name: CI

# Runs on every push to main and on every pull request targeting it.
#
# Both, rather than just PRs: a PR run proves the branch is good, and a push run
# proves main itself is good after the merge. They are not the same thing —
# two PRs that each pass alone can break main together.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch cancels the first run still in progress.
# There is no value in finishing a build for a commit that has already been
# replaced, and it keeps the queue short.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Backend: lint, then the full Jest suite.
  #
  # A separate job from the frontend rather than sequential steps in one, so the
  # two run in PARALLEL and a frontend failure does not hide a backend one. When
  # something breaks you want to see everything that broke, not the first thing.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          # Caches ~/.npm keyed on the lockfile, which turns a ~40s install into
          # a few seconds on every run after the first.
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # THE npm MAJOR IS PINNED, NOT JUST NODE.
      #
      # This is the fix for a real CI failure rather than caution. npm 10 and
      # npm 11 write DIFFERENT lock files for the same package.json: npm 11
      # records optional platform binaries (fsevents, the @unrs and @emnapi
      # resolver bindings) that npm 10 omits, and each version then REJECTS the
      # other's lock with "can only install packages when your package.json and
      # package-lock.json are in sync".
      #
      # So a developer on Node 24 — which ships npm 11 — regenerating the lock
      # broke every CI run and every deployment, with an error that points at
      # the lock file rather than at the npm version that wrote it. Pinning
      # means `npm ci` is always validated by the same npm that produced the
      # lock, whatever npm setup-node happens to ship with next.
      - name: Pin npm
        run: npm install -g npm@10

      # `npm ci` rather than `npm install`: it installs exactly what the
      # lockfile says and fails if package.json and the lockfile disagree. CI
      # should test the dependency tree that will actually be deployed, not
      # whatever npm resolves today.
      - name: Install
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      # The tests run against mongodb-memory-server, so no database service is
      # needed here — it downloads a mongod binary on first run and caches it.
      # tests/setup.js starts it as a single-node REPLICA SET, which is what
      # makes the transaction tests exercise transactions rather than silently
      # taking the non-transactional fallback.
      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: backend/node_modules/.cache/mongodb-memory-server
          key: mongodb-binary-${{ runner.os }}

      - name: Test
        working-directory: backend
        run: npm test

  # ---------------------------------------------------------------------------
  # Frontend: lint, component tests, and a production build.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # THE npm MAJOR IS PINNED, NOT JUST NODE.
      #
      # This is the fix for a real CI failure rather than caution. npm 10 and
      # npm 11 write DIFFERENT lock files for the same package.json: npm 11
      # records optional platform binaries (fsevents, the @unrs and @emnapi
      # resolver bindings) that npm 10 omits, and each version then REJECTS the
      # other's lock with "can only install packages when your package.json and
      # package-lock.json are in sync".
      #
      # So a developer on Node 24 — which ships npm 11 — regenerating the lock
      # broke every CI run and every deployment, with an error that points at
      # the lock file rather than at the npm version that wrote it. Pinning
      # means `npm ci` is always validated by the same npm that produced the
      # lock, whatever npm setup-node happens to ship with next.
      - name: Pin npm
        run: npm install -g npm@10

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test

      # The build is a test in its own right. Vite fails on an import that does
      # not resolve and on syntax the transform cannot handle — neither of which
      # the unit tests would catch, because they only load the modules a test
      # happens to import. A page nobody has written a test for can still be
      # broken, and this is what notices.
      - name: Build
        working-directory: frontend
        run: npm run build

  # ---------------------------------------------------------------------------
  # End-to-end: the real stack in a real browser.
  #
  # Deliberately a separate job that runs AFTER the other two pass. E2E is the
  # slowest and flakiest layer, and there is no point spending three minutes
  # booting browsers to discover a lint error. `needs` also means a red E2E
  # result is unambiguous: the units passed, so the failure is in how the pieces
  # fit together.
  # ---------------------------------------------------------------------------
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: npm

      # THE npm MAJOR IS PINNED, NOT JUST NODE.
      #
      # This is the fix for a real CI failure rather than caution. npm 10 and
      # npm 11 write DIFFERENT lock files for the same package.json: npm 11
      # records optional platform binaries (fsevents, the @unrs and @emnapi
      # resolver bindings) that npm 10 omits, and each version then REJECTS the
      # other's lock with "can only install packages when your package.json and
      # package-lock.json are in sync".
      #
      # So a developer on Node 24 — which ships npm 11 — regenerating the lock
      # broke every CI run and every deployment, with an error that points at
      # the lock file rather than at the npm version that wrote it. Pinning
      # means `npm ci` is always validated by the same npm that produced the
      # lock, whatever npm setup-node happens to ship with next.
      - name: Pin npm
        run: npm install -g npm@10

      # Both halves are needed: the specs drive the frontend, and the throwaway
      # server that backs them lives in the backend package.
      - name: Install backend
        working-directory: backend
        run: npm ci

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: backend/node_modules/.cache/mongodb-memory-server
          key: mongodb-binary-${{ runner.os }}

      # Only Chromium. Running three browsers triples the time to tell us the
      # same thing about an internal CRM whose users are not on Safari.
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: frontend
        run: npm run test:e2e

      # Kept only on failure, and only for a week. A trace from a passing run is
      # something nobody opens; a trace from a failing one is often the only way
      # to understand a failure that does not reproduce locally.
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
